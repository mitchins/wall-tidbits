# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  profile: assertive
  high_level_summary: true
  review_status: true
  pre_merge_checks:
    docstrings:
      mode: off
  auto_review:
    enabled: true
    drafts: false

chat:
  auto_reply: true
